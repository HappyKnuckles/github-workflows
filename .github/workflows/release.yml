name: Release

# Publishing a release vX.Y.Z moves the major tag vX to it, so callers pinned to
# `@vX` pick up the release. Prereleases leave the major tag alone.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move-major-tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Point the major tag at this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          MAJOR="v${BASH_REMATCH[1]}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $TAG ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
